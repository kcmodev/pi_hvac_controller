<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Control panel for a Raspberry Pi HVAC air freshener">
    <title>HVAC Air Freshener</title>
    <link rel="apple-touch-icon" href="{{ url_for('static', filename='images/apple-touch-icon.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  </head>
  <body>
    <main class="panel">
      <h1>HVAC Air Freshener</h1>

      <dl class="readings">
        <div>
          <dt>System status</dt>
          <dd id="system-status">Loading…</dd>
        </div>
        <div>
          <dt>Last spray</dt>
          <dd id="last-spray">Loading…</dd>
        </div>
      </dl>

      <button id="spray-button" type="button">Spray now</button>
      <p id="message" class="message" role="status"></p>
    </main>

    <script src="{{ url_for('static', filename='index.js') }}" defer></script>
  </body>
</html>
